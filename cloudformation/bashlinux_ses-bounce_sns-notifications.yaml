#      ConfigurationSetName: !Ref SESEmailFeedbackConfig
#      EventDestination:
#        Name: !Sub "bashlinux-${Environment}-bounce-destination"
#        Enabled: true
#        MatchingEventTypes:
#          - Bounce
#        SNSDestination:
#          TopicARN: !Ref BounceTopic

#  SESComplaintNotification:
#    Type: AWS::SES::ConfigurationSetEventDestination
#    DependsOn: ComplaintTopic
#    Properties:
#      ConfigurationSetName: !Ref SESEmailFeedbackConfig
#      EventDestination:
#        Name: !Sub "bashlinux-${Environment}-complaint-destination"
#        Enabled: true
#        MatchingEventTypes:
#          - Complaint
#        SNSDestination:
#          TopicARN: !Ref ComplaintTopic

###############################################################################
Outputs:

  BounceTopicArn:
    Description: ARN of the SNS Bounce Topic
    Value: !Ref BounceTopic
    Export:
      Name: !Sub "bashlinux-${Environment}-BounceTopicArn"

  ComplaintTopicArn:
    Description: ARN of the SNS Complaint Topic
    Value: !Ref ComplaintTopic
    Export:
      Name: !Sub "bashlinux-${Environment}-ComplaintTopicArn"
